[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thefocux-agent"
version = "1.0.0"
description = "THE FOCUX Agent — business superagent: content, ecommerce, opportunities, monetization. Provider-agnostic, plugin-ready, gates always on."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luciano Lopez Barba" }]
keywords = ["agent", "business", "content", "ecommerce", "monetization", "llm", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6.0",  # skill frontmatter parsing (runtime/skills.py)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
focux = "focux:main"
focux-web = "webui:main"

[tool.setuptools]
packages = ["policy", "runtime", "tools"]
py-modules = ["focux", "webui", "mcp_bridge"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.template"]
